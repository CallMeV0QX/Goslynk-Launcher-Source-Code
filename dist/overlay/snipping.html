<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goslynk Snipping Tool</title>
  <link rel="stylesheet" href="snipping.css" />
</head>

<body>
  <div id="snipping-container">
    <canvas id="bg-canvas"></canvas>

    <canvas id="mask-canvas"></canvas>

    <canvas id="draw-canvas"></canvas>
  </div>


  <div id="toolbar" class="hidden">
    <div class="tool-group">
      <button class="tool-btn active" data-tool="rect" title="Hình chữ nhật">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        </svg>
      </button>
      <button class="tool-btn" data-tool="arrow" title="Mũi tên">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
      <button class="tool-btn" data-tool="text" title="Chữ (Text)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="4 7 4 4 20 4 20 7"></polyline>
          <line x1="9" y1="20" x2="15" y2="20"></line>
          <line x1="12" y1="4" x2="12" y2="20"></line>
        </svg>
      </button>
      <button class="tool-btn" data-tool="blur" title="Che mờ (Blur)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M8 12h8"></path>
          <path d="M12 8v8"></path>
        </svg>
      </button>
    </div>

    <div class="tool-separator"></div>

    <div class="tool-group colors">
      <button class="color-btn active" data-color="#ff3b30" style="background-color: #ff3b30;"></button>
      <button class="color-btn" data-color="#ffcc00" style="background-color: #ffcc00;"></button>
      <button class="color-btn" data-color="#4cd964" style="background-color: #4cd964;"></button>
      <button class="color-btn" data-color="#007aff" style="background-color: #007aff;"></button>
    </div>

    <div class="tool-separator"></div>

    <div class="tool-group actions">
      <button class="action-btn" id="btn-copy" title="Copy (Ctrl+C)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
      <button class="action-btn" id="btn-save" title="Save (Ctrl+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
      </button>
      <button class="action-btn danger" id="btn-close" title="Hủy (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <script src="snipping.js"></script>
</body>

</html>

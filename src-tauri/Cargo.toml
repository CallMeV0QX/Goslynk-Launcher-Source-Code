[package]
name = "goslynk_launcher"
version = "0.13.7"
description = "Goslynk Launcher"
authors = ["Goslynk"]
edition = "2021"

[[bin]]
name = "goslynk-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["tray-icon", "webview-data-url", "image-ico", "image-png"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.2"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde-xml-rs = "0.6.0"
quick-xml = "0.37.5"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls", "multipart", "blocking"] }
futures-util = "0.3.32"

anyhow = "1.0.102"
base64 = "0.22.1"
byteorder = "1.5.0"
bytes = "1.11.1"
bzip2 = "0.4.4"
chrono = "0.4.44"
crc32fast = "1.5.0"
flate2 = "1.1.9"
glob = "0.3.3"
hmac = "0.12.1"
image = "0.25.10"
keyring = "2.3.3"
lazy_static = "1.5.0"
once_cell = "1.21.4"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
rand = "0.9.4"
rayon = "1.12.0"
regex = "1.12.3"
rfd = "0.16.0"
sha1 = "0.10.6"
sha2 = "0.10.9"
sysinfo = "0.30.13"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.23.2", features = ["v4"] }
walkdir = "2.5.0"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
zip = "0.6.6"
zstd = "0.11.2"

